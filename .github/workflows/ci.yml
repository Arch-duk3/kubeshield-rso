name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Code Quality (Ruff & Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff==0.4.0

      - name: Check Formatting (Python)
        run: ruff format --check .

      - name: Lint (Python)
        run: ruff check .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: simulator/go.sum

      - name: Check Formatting (Go)
        run: |
          if [ "$(gofmt -l simulator | wc -l)" -gt 0 ]; then
            echo "Go files not formatted properly"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r controller/requirements.txt
          pip install pytest-cov

      - name: Run Python Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/unit/python/ --cov=controller --cov-report=xml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: simulator/go.sum

      - name: Run Go Tests
        run: cd simulator && go test ./... -v -race

  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Simulator
        run: docker build -t krsi-simulator:test -f deploy/docker/Dockerfile.simulator simulator/

      - name: Build Controller
        run: docker build -t krsi-controller:test -f deploy/docker/Dockerfile.controller controller/

      - name: Trivy Scan (Simulator)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'krsi-simulator:test'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
